[package]
name = "unsloth-studio"
# Authoritative desktop SemVer; Tauri inherits this for the app and installers.
# Release automation must keep this field and the workspace lockfile in sync.
version = "0.2.0"
description = "Unsloth Desktop App"
authors = ["Unsloth AI"]
edition = "2021"
# std::fs::File::lock, used for the desktop ownership id.
rust-version = "1.89"

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.34"
simplelog = "0.12.2"
dirs = "7.0.0"
regex = "1.13.1"
open = "5.4.3"
process-wrap = { version = "10", features = ["std"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
arboard = "3.6.1"
tauri-plugin-dialog = "2"
rand = "0.10.2"
tauri-plugin-notification = "2.4.0"
tempfile = "3.27.0"
tauri-plugin-window-state = "2"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = "0.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
# GTK3 / WebKit2 and Tauri exchange GLib objects from the 0.18 binding family.
gdk-pixbuf = "0.18"
glib = "0.18"
gtk = "0.18.2"
elevated-command = "1.1.3"
webkit2gtk-sys = "2.0.2"
webkit2gtk = "2.0.2"

[target.'cfg(windows)'.dependencies]
# Keep these versions aligned with Tauri's WebView2 controller bindings.
webview2-com = "0.38.2"
winreg = "0.56"
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
windows-core = "0.61.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
