[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm==10.2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth"
dynamic = ["version"]
description = "2-5X faster training, reinforcement learning & finetuning"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
license = "Apache-2.0"
keywords = ["ai", "llm", "reinforcement learning", "machine learning", "artificial intelligence", "pytorch"]
authors = [
    {email = "info@unsloth.ai"},
    {name = "Unsloth AI team"},
]
maintainers = [
    {name = "Daniel Han", email = "daniel@unsloth.ai"},
    {name = "Michael Han", email = "info@unsloth.ai"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer==0.27.2",
    # Data Designer 0.9 requires Rich <15 in the shared Studio environment.
    "rich==14.3.4",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "nest-asyncio==1.6.0",
    "huggingface-hub==1.30.0",
    # Every CLI command imports studio.backend.*, which reaches structlog at
    # module level. The rest of the server stack lives in the studio extra.
    "structlog==26.1.0",
    # unsloth_cli/__init__.py reaches click via commands/start.py, so every
    # command needs it. typer supplied it until 0.27 dropped the dependency.
    # SQLFluff 4.3 (Data Designer) requires Click <8.5.
    "click==8.4.2",
]

[project.scripts]
unsloth = "unsloth_cli:app"

[tool.setuptools.dynamic]
version = {attr = "unsloth._version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
unsloth_cli = ["codex_fallback_prompt.md", "pi_subagent.ts"]
studio = [
    "*.sh",
    "*.ps1",
    "*.bat",
    "node_prebuilt_pins.json",
    "src-tauri/icons/icon.icns",
    "src-tauri/icons/icon.png",
    "src-tauri/src/**/*",
    "frontend/dist/**/*",
    "frontend/src/**/*",
    "frontend/*.json",
    "frontend/*.ts",
    "frontend/*.js",
    "frontend/*.html",
    "frontend/*.yaml",
    "frontend/.git*",
    "backend/requirements/**/*",
    # Truststore and the separately installed Zoo companion ship as source data.
    "backend/vendor/**/*",
    "backend/plugins/**/*",
    "backend/assets/**/*.jinja",
    "backend/assets/**/*.html",
    # Swagger UI / ReDoc, served from this origin instead of a CDN. Without these the
    # /docs and /redoc pages render blank in an installed Unsloth.
    "backend/assets/docs_ui/*",
    "backend/core/data_recipe/oxc-validator/*.json",
    "backend/core/data_recipe/oxc-validator/*.mjs",
]

[tool.setuptools.packages.find]
include = ["unsloth*", "unsloth_cli*", "studio", "studio.backend*"]
exclude = [
    "images*",
    "tests*",
    "studio.backend.tests*",
    "studio.backend.*.tests*",
    "studio.backend.vendor.unsloth_zoo_compat*",
    "unsloth_cli.tests*",
    "unsloth.kernels.moe.tests*",
    "unsloth_compiled_cache*",
    "*.unsloth_compiled_cache*",
    "*.node_modules",
    "*.node_modules.*",
]

# Excluding a tests package above is not enough: include-package-data re-ships its
# files as data of the surviving parent (pypa/setuptools#3260), and only
# exclude-package-data outranks that.
[tool.setuptools.exclude-package-data]
"studio.backend" = ["tests/*"]
"studio.backend.hub" = ["tests/*"]

[project.optional-dependencies]
# Keep this list synchronized with studio/backend/requirements/studio.txt.
studio = [
    "typer==0.27.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "protobuf @ https://files.pythonhosted.org/packages/16/28/d5065b212685875d3924bcdb3201cbf467cb4d58a18aa19a8dfd99ea80a9/protobuf-4.25.9-py3-none-any.whl#sha256=d49b615e7c935194ac161f0965699ac84df6112c378e05ec53da65d2e4cbb6d4",
    "packaging==26.3",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
    "nest_asyncio==1.6.0",
    "datasets==5.0.1",
    "pyjwt==2.13.0",
    "huggingface-hub==1.30.0",
    "urllib3==2.7.0",
    "jinja2==3.1.6",
    "structlog==26.1.0",
    "diceware==1.0.1",
    "ddgs==9.16.0",
    "cryptography==49.0.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography==48.0.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "boto3==1.43.89",
    "httpx==0.28.1",
    "fastmcp==3.4.7",
    "gguf==0.19.0",
    "av==18.1.0 ; sys_platform != 'darwin'",
    "av==15.1.0 ; sys_platform == 'darwin'",
    "sqlite-vec==0.1.9",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2 ; sys_platform != 'darwin'",
    "pymupdf4llm==0.3.4 ; sys_platform == 'darwin'",
    "python-docx==1.2.0",
]

triton = [
    "triton==3.8.0 ; sys_platform == 'linux'",
    "triton-windows==3.8.0.post28 ; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]

huggingfacenotorch = [
    "unsloth_zoo==2026.9.1+darbot.1",
    "wheel==0.48.0",
    "packaging==26.3",
    "numpy==2.5.3",
    "tqdm==4.70.0",
    "psutil==7.2.2",
    "tyro==1.0.16",
    # AudioTools requires <5; protobuf 4's native ABI is incompatible with 3.14.
    "protobuf @ https://files.pythonhosted.org/packages/16/28/d5065b212685875d3924bcdb3201cbf467cb4d58a18aa19a8dfd99ea80a9/protobuf-4.25.9-py3-none-any.whl#sha256=d49b615e7c935194ac161f0965699ac84df6112c378e05ec53da65d2e4cbb6d4",
    "sentencepiece==0.2.2",
    "safetensors==0.8.0",
    "datasets==5.0.1",
    "dill==0.4.1",
    "multiprocess==0.70.19",
    "accelerate==1.14.0",
    "peft==0.20.0",
    "huggingface-hub==1.30.0",
    "hf_transfer==0.1.9",
    "diffusers==0.40.0",
    "transformers==5.16.1",
    "trl==1.12.0",
    "sentence-transformers==6.0.1",
    "scikit-learn==1.9.0",
]

huggingface = [
    "unsloth[huggingfacenotorch]",
    "unsloth_zoo[cuda]==2026.9.1+darbot.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "unsloth[triton]",
]

base = ["unsloth[huggingface]"]
windows = ["unsloth[cu130-torch2140]"]

# TorchCodec and TorchAudio use independent release numbers. There is no
# TorchAudio 2.14 release; do not derive companion versions from Torch's minor.
audio-torch2140 = [
    "torchcodec==0.16.0 ; ((sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

# These extras require the matching official PyTorch index. CUDA 12.8 has no
# Torch 2.14 wheel, so historical CUDA/Torch combinations are not aliases.
cu130onlytorch2140 = [
    "torch==2.14.0+cu130",
    "torchvision==0.29.0+cu130",
    "torchaudio==2.11.0+cu130",
    "xformers @ https://download.pytorch.org/whl/cu130/xformers-0.0.35-py39-none-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "xformers @ https://download.pytorch.org/whl/cu130/xformers-0.0.35-py39-none-win_amd64.whl ; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
cu130-torch2140 = [
    "unsloth[huggingface,audio-torch2140]",
    "bitsandbytes==0.50.2",
    "torchao==0.18.0",
    "unsloth[cu130onlytorch2140]",
]
cu130-ampere-torch2140 = ["unsloth[cu130-torch2140]"]

cpu = [
    "unsloth[huggingfacenotorch,audio-torch2140]",
    "torch==2.14.0+cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision==0.29.0+cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio==2.11.0+cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.14.0 ; sys_platform == 'darwin'",
    "torchvision==0.29.0 ; sys_platform == 'darwin'",
    "torchaudio==2.11.0 ; sys_platform == 'darwin'",
]

intelgputorch2140 = [
    "unsloth[huggingfacenotorch,audio-torch2140]",
    "torch==2.14.0+xpu",
    "torchvision==0.29.0+xpu",
    "torchaudio==2.11.0+xpu",
    "triton-xpu==3.8.0",
    "bitsandbytes==0.50.2",
]
intel-gpu-torch2140 = ["unsloth[intelgputorch2140]"]

rocm72-torch2140 = [
    "unsloth[huggingfacenotorch,audio-torch2140]",
    "torch==2.14.0+rocm7.2",
    "torchvision==0.29.0+rocm7.2",
    "torchaudio==2.11.0+rocm7.2",
    "triton-rocm==3.8.0",
    "bitsandbytes==0.50.2",
]

[project.urls]
homepage = "https://unsloth.ai"
documentation = "https://unsloth.ai/docs"
repository = "https://github.com/darbotlabs/darbot-unsloth"

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = [
    "*chat_templates.py",
    "*ollama_template_mappers.py",
    "*_auto_install.py",
    "*mapper.py",
    # Vendored upstream source: reformatting it would break the digest test.
    "studio/backend/vendor/",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
    "E402",
    "E722",
    "F403",
    "F405",
    "F811",
    "F821",
    "F841",
    "F401",
    "E731",
    "E741",
    "F601",
    "E712",
]

[tool.ruff.format]

[tool.pytest.ini_options]
# Narrow the default test discovery so `pytest` from the repo root
# does NOT pick up the GPU-heavy tests under tests/python, tests/qlora,
# etc. The CI security job runs `pytest tests/security` explicitly.
testpaths = ["tests/security"]
pythonpath = ["."]

# testpaths only protects a bare `pytest`. Anyone who types `pytest tests/`
# gets the whole walk, and a handful of files in it download and merge real
# checkpoints: measured, `pytest tests/ -n 16` was 16m22s, and 34 of the 17.5k
# tests accounted for 11 of those minutes. Markers are what make that opt-in.
#
# `slow` predates this: seven uses in
# tests/python/test_embed_lm_head_target_modules_redirect.py, never registered
# and never consumed, so the author's intent was inert. Registering it is what
# turns the existing annotations on.
markers = [
    "gpu: needs a real accelerator, and usually downloads a checkpoint to use it",
    "slow: minutes rather than seconds, and covered again more cheaply elsewhere",
]

# Deselected by default, not deleted: CI runs them in their own leg with
# `-m 'gpu or slow'`, and `pytest -m gpu tests/` gets them back locally.
# A run that names one of these files directly will report "no tests ran"
# until you pass `-m gpu` -- that is the cost of the default being fast.
addopts = "-m 'not gpu and not slow'"
